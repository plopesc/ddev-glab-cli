#ddev-generated
hooks:
  pre-start:
    # Ensure host-side glab paths exist so Docker bind-mounts them as the
    # correct type (file vs directory).  If a file does not exist, Docker would
    # create a directory at that path instead, breaking the mount.
    - exec-host: "mkdir -p ~/.config/glab-cli && touch ~/.config/glab-cli/config.yml ~/.config/glab-cli/aliases.yml && chmod 600 ~/.config/glab-cli/config.yml ~/.config/glab-cli/aliases.yml"
  post-start:
    # Copy the read-only host seed into glab's writable runtime config
    # directory on every start. Host config is authoritative, so
    # container-only drift is discarded and replaced with the host's copy
    # each time the project starts.
    #
    # The seed directory is the fixed mount point declared in
    # docker-compose.glab-cli.yaml; it deliberately does not use ${HOME},
    # which differs between host and container on macOS. See that file.
    - exec: |
        set -eu
        seed_dir="/mnt/ddev-glab-cli-seed"
        target_dir="${HOME}/.config/glab-cli"
        if [ ! -d "${seed_dir}" ]; then
          echo "glab-cli: no host config mounted at ${seed_dir}; skipping config sync." >&2
          exit 0
        fi
        mkdir -p "${target_dir}"
        for file in config.yml aliases.yml; do
          if [ -f "${seed_dir}/${file}" ]; then
            cp "${seed_dir}/${file}" "${target_dir}/${file}"
            chmod 600 "${target_dir}/${file}"
          fi
        done
